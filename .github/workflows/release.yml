name: Release

# Manually dispatched from main once CI is green. CI creates and signs the tag with the
# release key (Actions secret RELEASE_GPG_KEY; public key in .github/release-signing-key.asc),
# builds the sdist and wheel, writes SHA256SUMS, attests build provenance and publishes the
# GitHub release. Nothing is uploaded to PyPI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (matches pyproject.toml), e.g. 0.0.1"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version
        run: |
          grep -qx "version = \"${{ inputs.version }}\"" pyproject.toml
          ! git rev-parse -q --verify "refs/tags/v${{ inputs.version }}"
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest -q
          python tools/check_budgets.py
      - name: Signed tag
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$RELEASE_GPG_KEY" | gpg --batch --import
          key="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
          git config user.name ao3575911
          git config user.email 280728713+ao3575911@users.noreply.github.com
          git config user.signingkey "$key"
          git tag -s "v${{ inputs.version }}" -m "Sayform ${{ inputs.version }}"
          git tag -v "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          rm -rf "$GNUPGHOME"
      - name: Build
        run: |
          pip install build
          python -m build --outdir dist
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## \[${{ inputs.version }}\]/{f=1; next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          gh release create "v${{ inputs.version }}" dist/* --title "Sayform ${{ inputs.version }}" --notes-file notes.md --verify-tag
