name: Bug
description: The interpreter does something the spec says it should not.
labels: [bug]
body:
  - type: textarea
    id: program
    attributes: {label: Program, description: The smallest .say program that shows the bug., render: text}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected, description: What should happen, with the spec section.}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual, description: What happened (output and exit code).}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: say --version}
    validations: {required: true}
